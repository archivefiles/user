<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Images</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
    min-height: 100vh;
  }
  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1e1f24;
    color: #fff;
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .user-id {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .user-id svg { display: block; }
  .breadcrumb {
    margin-right: 10px;              /* little right gap */
    font-size: 14px;
    color: #9aa0aa;
  }
  .breadcrumb a {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .breadcrumb a:hover { color: #7fb0e8; }
  .breadcrumb .sep { margin: 0 6px; color: #5a5f68; }

  /* ---------- File Grid ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 16px 60px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }
  .file {
    background: transparent;
    border: 1px solid transparent;
    padding: 18px 10px 14px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .file:hover { background: #eceef2; }
  .file.selected { background: #e2e8f4; }
  .file svg { width: 60px; height: 48px; display: block; margin: 0 auto; }
  .file-name {
    margin-top: 10px;
    font-size: 14px;
    word-break: break-word;
    outline: none;
    min-height: 18px;
  }
  .file-name[contenteditable="true"] {
    background: #fff8d6;
    border: 1px solid #d9c25a;
    cursor: text;
    user-select: text;
  }
</style>
<base target="_blank">
</head>
<body>

<header>
  <div class="user-id">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0aa" stroke-width="2" stroke-linecap="square">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
    </svg>
    1412555132118
  </div>

  <!-- EDIT THIS LINK: change href to whatever page "Images" should open -->
  <div class="breadcrumb"><a href="file-manager.html">Images</a><span class="sep">&gt;</span></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
/* ============================================================
   EDIT YOUR FOLDERS HERE
   - "name" = the folder name shown on screen
   - "link" = the website that opens when you click the folder
   Add a new line { name: "...", link: "..." }, to create more folders
   ============================================================ */
const FOLDERS = [
  { name: "Udvash Results", link: "https://www.udvash-unmesh.com/" },
  { name: "Study Times",    link: "https://www.google.com/" },
  { name: "Class Notes",    link: "https://www.google.com/" }
];

/* ---------- Professional folder icon (same style as old html) ---------- */
const FOLDER_ICON = `<svg viewBox="0 0 60 48" xmlns="http://www.w3.org/2000/svg">
  <path d="M2 10a4 4 0 0 1 4-4h14l6 6h28a4 4 0 0 1 4 4v26a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V10z" fill="#2f6fb2"/>
  <path d="M2 16h56v26a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V16z" fill="#5b94cf"/>
</svg>`;

const grid = document.getElementById("grid");

FOLDERS.forEach(f => {
  const el = document.createElement("div");
  el.className = "file";
  el.innerHTML = `${FOLDER_ICON}<div class="file-name">${f.name}</div>`;
  grid.appendChild(el);

  const nameEl = el.querySelector(".file-name");
  const original = f.name;
  let clickTimer = null;
  let renaming = false;

  function openFolder() {
    window.open(f.link, "_blank");   // opens the folder's link in a new tab
  }

  function startRename() {
    renaming = true;
    nameEl.contentEditable = "true";
    nameEl.classList.add("editing");
    nameEl.focus();
    // Select all text like Windows
    const range = document.createRange();
    range.selectNodeContents(nameEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function endRename(showMsg) {
    if (!renaming) return;
    renaming = false;
    nameEl.contentEditable = "false";
    nameEl.classList.remove("editing");
    if (showMsg) {
      alert("You haven't access to change file name");
    }
    nameEl.textContent = original;   // always revert to old name
  }

  nameEl.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      endRename(true);       // Enter -> show "no access" message
    }
    if (e.key === "Escape") {
      e.preventDefault();
      endRename(false);
    }
  });
  nameEl.addEventListener("blur", () => endRename(false)); // click elsewhere -> old name back

  el.addEventListener("click", e => {
    if (renaming) return;
    if (clickTimer) {                 // second click = double click
      clearTimeout(clickTimer);
      clickTimer = null;
      if (e.target === nameEl || nameEl.contains(e.target)) startRename();
    } else {
      clickTimer = setTimeout(() => { // single click -> open folder link
        clickTimer = null;
        el.classList.add("selected");
        setTimeout(() => el.classList.remove("selected"), 300);
        openFolder();
      }, 260);
    }
  });
});
</script>
</body>
</html>
